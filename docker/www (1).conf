;
; FPM configuration file
; http://www.php.net/manual/en/install.fpm.configuration.php
;

[www]
; Unix user/group of processes
user = www-data
group = www-data

; Using this port instead of a socket for better compatibility
listen = 9000
listen.backlog = 65535

; Choose how the process manager will control the number of child processes.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Redirect worker stdout and stderr into main error log. 
catch_workers_output = yes

; Decorate worker output with pool name and date/time (default: no)
decorate_workers_output = yes

; Set session path to be shared
php_value[session.save_path] = /tmp

; Allow environment variables
clear_env = no

; Limit Extensions
security.limit_extensions = .php

; Enable access log
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r\" %s"

; Additional settings for stability
request_terminate_timeout = 300
request_slowlog_timeout = 10
slowlog = /proc/self/fd/2

; Error log
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
