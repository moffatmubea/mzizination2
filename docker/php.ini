[PHP]
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 300

; Display errors for debugging (set to 0 in production)
display_errors = Off
log_errors = On
error_log = /app/storage/logs/php-error.log

; Date/time settings
date.timezone = UTC

; Set default charset
default_charset = "UTF-8"

; Enable opcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 60
