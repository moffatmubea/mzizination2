[PHP]
; Maximum execution time of each script, in seconds
max_execution_time = 300

; Maximum amount of memory a script may consume
memory_limit = 512M

; Maximum size of POST data that PHP will accept
post_max_size = 100M

; Maximum allowed size of uploaded files
upload_max_filesize = 100M

; Default socket timeout value
default_socket_timeout = 60

; Enable realpath cache for better performance
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Disable displaying errors to users (log instead)
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Set default character encoding
default_charset = "UTF-8"

; Session configuration
session.gc_maxlifetime = 1440

; OPcache configuration
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

; Disable dangerous functions
disable_functions = proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Error reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
